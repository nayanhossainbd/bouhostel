{% extends 'layout.html' %}
{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-4 card p-4 shadow-sm border-0">
            <h3 class="fw-bold text-center mb-4">Change Password</h3>
            <form method="post">
                {% csrf_token %}
                {{ form.as_p }}
                <button type="submit" class="btn btn-danger w-100 rounded-pill">Update Password</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
